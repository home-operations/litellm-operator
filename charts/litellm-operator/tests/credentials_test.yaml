---
suite: proxy credentials
templates:
  - templates/rbac.tpl
tests:
  - it: grants credential lifecycle permissions without webhooks
    documentIndex: 0
    set:
      webhook.enabled: false
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [create, delete, get, list, patch, update, watch]
